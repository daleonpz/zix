CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="Central test cert"

CONFIG_LOG=y
CONFIG_BT_GATT_CLIENT=y

# CONFIG_BT_BUF_ACL_RX_SIZE=255
# CONFIG_BT_BUF_ACL_TX_SIZE=251
# CONFIG_BT_BUF_CMD_TX_SIZE=255
# CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255
# 
# CONFIG_BT_L2CAP_TX_MTU=247

## Number of buffers available for ATT prepare write, setting this to 0 disables GATT long/reliable writes.
#zephyr/doc/connectivity/bluetooth/api/audio/bluetooth-le-audio-arch.rst
#Read long Characteristic Value by setting :kconfig:option:`CONFIG_BT_ATT_PREPARE_COUNT` to a non-zero value.
CONFIG_BT_ATT_PREPARE_COUNT=3
# CONFIG_BT_ATT_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=2048
# CONFIG_BT_LOG_LEVEL_DBG=y
# CONFIG_BT_SMP=y
# CONFIG_BT_PRIVACY=y
CONFIG_BT_TESTING=y
CONFIG_BT_OOB_DATA_FIXED=y
CONFIG_BT_USE_DEBUG_KEYS=y

CONFIG_DEBUG_OPTIMIZATIONS=y
